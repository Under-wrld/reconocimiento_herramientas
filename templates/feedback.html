<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4">Resultado del Análisis</h2>

    <!--imagen y prediccion -->
    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename=img_rel) }}" alt="Herramienta detectada" class="img-fluid" style="max-height: 400px;">
        <p class="mt-3 fs-5">Predicción: <strong>{{ pred|capitalize }}</strong><br>
        Confianza: <strong>{{ (conf * 100)|round(2) }}%</strong></p>
    </div>

    <!--formulario de feedback -->
    <div class="card p-4 shadow-sm">
        <form method="POST" action="{{ url_for('feedback') }}">
            <div class="mb-3">
                <label for="etiqueta" class="form-label">¿Es correcta la predicción?</label>
                <select name="etiqueta" class="form-select" required>
                    <option disabled selected value="">Selecciona la herramienta correcta</option>
                    {% for clase in clases %}
                        <option value="{{ clase }}">{{ clase.capitalize() }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-success">enviar Feedback</button>
        </form>
    </div>

    <div class="mt-4 text-center">
        <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">volver al inicio</a>
    </div>
</div>

</body>
</html>
