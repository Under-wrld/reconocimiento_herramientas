<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detección de Herramientas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">Detección de Herramientas</h1>

    <!-- Mensajes flash -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-info">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Formulario de análisis de imagen -->
    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="imagen" class="form-label">Selecciona una imagen</label>
            <input type="file" name="imagen" class="form-control" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-primary">Analizar Imagen</button>
        <a href="{{ url_for('stats.mostrar_stats') }}" class="btn btn-outline-info mt-3">Ver estadísticas del modelo</a>
    </form>

    {% if resultado %}
        <div class="mt-5 text-center">
            <h2>{{ resultado }}</h2>
            <img src="{{ url_for('static', filename=imagen) }}" class="img-fluid mt-3" alt="Imagen subida" style="max-width:400px;">
        </div>
    {% endif %}
